services:
  yamtrack:
    container_name: "yamtrack"
    image: "ghcr.io/fuzzygrim/yamtrack"
    restart: "unless-stopped"
    depends_on:
      - "db"
      - "redis"
    environment:
      TZ: "${TZ:-Etc/UTC}"
      # Generate a random value securely:
      #     $ docker compose run --rm --entrypoint "python" yamtrack -c "\
      #     from django.core.management.utils import get_random_secret_key; \
      #     print(get_random_secret_key())"
      SECRET: "${SECRET:?Must set to secure random string!}"
      REDIS_URL: "redis://redis:6379"
      DB_HOST: "postgres"
      DB_NAME: "yamtrack"
      DB_USER: "postgres"
      DB_PASSWORD: >-
        ${POSTGRES_PASSWORD:-${SECRET:?Must set to secure random string!}}
      DB_PORT: "5432"
    ports:
      - "${LAN_IP:-127.0.0.1}:8000:8000"

  postgres:
    image: "postgres:16-alpine"
    container_name: "postgres"
    environment:
      POSTGRES_PASSWORD: >-
        ${POSTGRES_PASSWORD:-${SECRET:?Must set to secure random string!}}
    volumes:
      - "./postgresql/data/:/var/lib/postgresql/data/"
    restart: "unless-stopped"

  redis:
    container_name: "yamtrack-redis"
    image: "redis:8-alpine"
    restart: "unless-stopped"
    volumes:
      - "redis_data:/data"

volumes:
  redis_data:
